    <script>
        let text = window.location.search
        const ip = text.replace("?ip=", "").replace(/\?port\=[0-9]*/, "")
        const port = text.replace("?port=", "").replace(/\?ip\=[A-Za-z.]*/, "")
        console.log(ip)
        console.log(port)
        console.log(`minecraft://?addExternalServer=${ip}|${ip}:${port}`)

        // TURN ON OR OFF REDIRECT

        const MC = window.open(`minecraft://?addExternalServer=${ip}|${ip}:${port}`)
        console.log("MC:", MC)

    </script>
